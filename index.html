

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grandpas With Guitars — Back to the Music. Back to the Art.">
  <title>Grandpas With Guitars</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(
        ellipse at top, #533922, #1c1511 75%
      );
      color: #f5e8d2;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 1200px;
      padding: 18px 18px 35px;
      background: rgba(15, 12, 10, 0.5);
      border: 2px solid #aa874f;
      border-radius: 14px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      text-align: center;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px 0 15px;
    }

    .links a {
      display: inline-block;
      min-width: 245px;
      padding: 18px 25px;
      background: #c69a55;
      color: #201812;
      border-radius: 7px;
      font: bold 18px Arial, sans-serif;
      text-decoration: none;
      transition: background 0.2s;
    }

    .links a:hover,
    .links a:focus {
      background: #f2c77c;
    }

    footer {
      margin-top: 24px;
      color: #c6b69d;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      main {
        padding: 10px 10px 24px;
      }

      .links {
        gap: 12px;
        margin-top: 22px;
      }

      .links a {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <main>

    <img
      class="banner"
      src="GWG%20Facebook%20Banner.png"
      alt="Grandpas With Guitars — Back to the Music. Back to the Art. A welcoming music room filled with guitars, drums, and keyboards."
    >

    <nav class="links" aria-label="Visit Grandpas With Guitars">
      <a href="https://grandpaswithguitars.etsy.com">
        Visit Our Etsy Shop
      </a>

      <a href="https://www.facebook.com/profile.php?id=61595177290459">
        Visit Our Facebook Page
      </a>
    </nav>

    <footer>
      Music. Friendship. Creativity. Community.
    </footer>

  </main>
</body>
</html>
